<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Ujian - Kelas 9</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --primary-color: #00c3ff;
      --primary-glow: rgba(0, 195, 255, 0.4);
      --box-bg-top: #0a1428;
      --box-bg-bottom: #050a14;
      --hover-bg-top: #0d1e3d;
      --hover-bg-bottom: #162f5d;
    }

    body {
      background-color: #050a14;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    #background-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      position: absolute;
      top: 0;
      z-index: 10;
    }

    .user-badge {
      background: rgba(10, 15, 30, 0.8);
      border: 1px solid var(--primary-glow);
      padding: 8px 16px;
      border-radius: 20px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .logout-btn:hover {
      background: rgba(239, 68, 68, 0.3);
      color: white;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    .clock-card {
      margin-top: 80px;
      margin-bottom: 5px;
      padding: 12px 30px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 195, 255, 0.35);
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px var(--primary-glow);
      text-align: center;
      z-index: 1;
    }

    .clock-title {
      font-size: 11px;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .clock-time {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 12px var(--primary-glow);
      letter-spacing: 2px;
    }

    .clock-date {
      font-size: 13px;
      color: #a0aec0;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px var(--primary-glow);
      z-index: 1;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 25px;
      justify-content: center;
      max-width: 900px;
      z-index: 1;
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 195, 255, 0.2);
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 195, 255, 0.05);
      margin-bottom: 40px;
      width: 90%;
      min-height: 200px;
    }

    .subject-box {
      width: 100%;
      max-width: 200px;
      height: 90px;
      background: linear-gradient(135deg, var(--box-bg-bottom) 0%, var(--box-bg-top) 100%);
      color: var(--primary-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      transition: all 0.3s ease;
      text-decoration: none;
      border: 1px solid rgba(0, 195, 255, 0.3);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      padding: 10px;
    }

    .subject-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary-color), transparent);
      opacity: 0.5;
    }

    .subject-box:hover {
      background: linear-gradient(135deg, var(--hover-bg-bottom) 0%, var(--hover-bg-top) 100%);
      color: #ffffff;
      transform: translateY(-5px) scale(1.02);
      border-color: var(--primary-color);
      box-shadow: 0 8px 25px var(--primary-glow), 0 0 10px rgba(0, 195, 255, 0.2);
    }

    .status-badge {
      font-size: 11px;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .status-open { background: rgba(0, 195, 255, 0.15); color: #00c3ff; border: 1px solid rgba(0,195,255,0.3); }

    .loading-text {
      color: var(--primary-color);
      font-size: 16px;
      font-weight: 600;
      animation: pulse 1.5s infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 10px;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    #exam-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050a14;
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }

    .exam-header {
      height: 60px;
      background: rgba(10, 20, 40, 0.95);
      border-bottom: 1px solid var(--primary-glow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .exam-title-badge {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .exam-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .exam-iframe-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      background-color: #ffffff;
    }

    .exam-iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .hidden { display: none !important; }

    #custom-confirm-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(5, 10, 20, 0.85);
      backdrop-filter: blur(5px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .confirm-box {
      background: linear-gradient(135deg, var(--box-bg-bottom) 0%, var(--box-bg-top) 100%);
      border: 1px solid var(--primary-color);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 195, 255, 0.2);
      max-width: 400px;
      width: 90%;
    }

    .confirm-box p {
      margin-bottom: 25px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      line-height: 1.5;
    }

    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    @media (max-width: 600px) {
      .subject-box { max-width: 100%; height: 80px; }
      .top-bar { padding: 15px; }
      .clock-card { margin-top: 70px; }
      .exam-header { padding: 0 10px; }
      .exam-title-badge { font-size: 12px; }
    }
  </style>
</head>
<body>
  
  <canvas id="background-canvas"></canvas>

  <div class="top-bar">
    <div class="user-badge">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg>
      <span id="student-name">Peserta Ujian</span>
    </div>
    <a href="#" class="logout-btn" onclick="requestLogout()">Keluar</a>
  </div>

  <div class="clock-card">
    <div class="clock-title">WAKTU SEKARANG</div>
    <div id="live-time" class="clock-time">00:00:00 WIB</div>
    <div id="live-date" class="clock-date">Loading tanggal...</div>
  </div>

  <h1>JADWAL UJIAN KELAS 9</h1>

  <!-- Kontainer Jadwal -->
  <div class="container" id="jadwal-container">
    <div class="loading-text" id="loading-indicator">
      <span>Menyinkronkan jadwal ujian...</span>
      <span style="font-size: 12px; color: #a0aec0; font-weight: 400;">Membaca data dari Google Sheet</span>
    </div>
  </div>

  <div id="exam-modal" class="hidden">
    <div class="exam-header">
      <div class="exam-title-badge" id="exam-title-display">UJIAN ONLINE</div>
      <div class="exam-actions">
        <button class="back-btn" onclick="requestCloseExam()">← Kembali</button>
        <button class="logout-btn" onclick="requestLogout()">Keluar</button>
      </div>
    </div>
    <div class="exam-iframe-container">
      <iframe id="exam-iframe" src="" allow="autoplay"></iframe>
    </div>
  </div>

  <!-- Modal Custom untuk Peringatan (Menggantikan Alert) -->
  <div id="custom-confirm-modal" class="hidden">
    <div class="confirm-box">
      <p id="confirm-message">Pesan peringatan</p>
      <div class="confirm-actions">
        <button class="back-btn" id="confirm-cancel-btn" onclick="closeConfirmModal()">Batal</button>
        <button class="logout-btn" id="confirm-yes-btn">Ya</button>
      </div>
    </div>
  </div>

  <script>
    // URL CSV langsung dari pengguna
    const googleSheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTBV8pMvYqvh8oHk3wfpJB854-Q77h3geM0oCW7YFRe6NTzdx0M5t9hxw711Is_vEYuecNVOZ6r5nn2/pub?gid=2096748689&single=true&output=csv';

    // Menyimpan data jadwal mentah dari server
    let scheduleData = []; 
    let isFetching = false;

    document.addEventListener("DOMContentLoaded", () => {
      const nama = sessionStorage.getItem("userNama");
      if (nama) {
        const nameElement = document.getElementById("student-name");
        if (nameElement) nameElement.textContent = nama;
      }

      updateLiveClock();
      fetchSchedule(); // Ambil data segera
      
      setInterval(updateLiveClock, 1000); // Update jam 1 detik
      setInterval(renderSchedule, 1000);  // Cek buka/tutup ujian 1 detik
      setInterval(fetchSchedule, 30000);  // Sync ulang dari sheet 30 detik
    });

    // Pemisah CSV yang tahan banting, menangani koma dalam tanda kutip dan \r
    function parseCSVLine(text) {
      let ret = [];
      let inQuote = false;
      let value = '';
      text = text.replace(/\r/g, ''); 
      
      for (let i = 0; i < text.length; i++) {
        let ch = text[i];
        if (inQuote) {
          if (ch === '"') {
            if (i + 1 < text.length && text[i+1] === '"') { value += '"'; i++; } 
            else { inQuote = false; }
          } else { value += ch; }
        } else {
          if (ch === '"') { inQuote = true; }
          else if (ch === ',') { ret.push(value.trim()); value = ''; }
          else { value += ch; }
        }
      }
      ret.push(value.trim());
      return ret;
    }

    // Pembaca format tanggal yang lebih pintar (Support Format Indonesia)
    function parseCustomDate(dateStr) {
      if (!dateStr || dateStr.trim() === '') return null;
      let str = dateStr.trim();
      
      let d = new Date(str);
      if (!isNaN(d.getTime()) && str.includes('T')) return d;

      let parts = str.split(/[\sT]+/);
      if (parts.length >= 1) {
        let datePart = parts[0];
        let timePart = parts[1] || "00:00:00"; 
        
        let dateTokens = datePart.split(/[-/]/); 
        
        if (dateTokens.length === 3) {
          let year, month, day;
          
          if (dateTokens[0].length === 4) {
             year = parseInt(dateTokens[0]);
             month = parseInt(dateTokens[1]) - 1;
             day = parseInt(dateTokens[2]);
          } else {
             day = parseInt(dateTokens[0]);
             month = parseInt(dateTokens[1]) - 1;
             year = parseInt(dateTokens[2]);
          }

          let timeTokens = timePart.split(':');
          let hours = parseInt(timeTokens[0]) || 0;
          let minutes = parseInt(timeTokens[1]) || 0;
          let seconds = parseInt(timeTokens[2]) || 0;

          let parsedDate = new Date(year, month, day, hours, minutes, seconds);
          if (!isNaN(parsedDate.getTime())) return parsedDate;
        }
      }
      return null;
    }

    async function fetchSchedule() {
      if (isFetching) return;
      isFetching = true;
      try {
        const response = await fetch(googleSheetCsvUrl);
        
        if (!response.ok) throw new Error('Gagal menghubungi Google Sheet');
        
        const data = await response.text();
        const rows = data.split(/\n/);
        
        let newData = [];
        
        for (let i = 1; i < rows.length; i++) {
          const rowText = rows[i];
          if (!rowText.trim()) continue; 
          
          const cols = parseCSVLine(rowText);
          
          if (cols.length >= 1 && cols[0] !== '') {
            newData.push({
              subject: cols[0],
              url: cols[1] || '#',
              releaseStr: cols[2] || null,
              expireStr: cols[3] || null
            });
          }
        }
        
        scheduleData = newData;
        renderSchedule(); 

      } catch (error) {
        console.error('Error Sync:', error);
        if (scheduleData.length === 0) {
          document.getElementById('jadwal-container').innerHTML = `
            <div style="color: #fca5a5; width: 100%; text-align: center; display:flex; flex-direction:column; gap:10px;">
              <span style="font-weight:bold; font-size: 16px;">⚠️ Gagal Menyinkronkan Jadwal</span>
              <span style="font-size: 13px;">Pastikan koneksi internet stabil atau pengaturan Google Sheet Publik sudah benar.</span>
            </div>`;
        }
      } finally {
        isFetching = false;
      }
    }

    function renderSchedule() {
      const container = document.getElementById('jadwal-container');
      const now = new Date();
      
      if (scheduleData.length === 0 && !isFetching) {
        container.innerHTML = `
          <div style="color: #a0aec0; width: 100%; text-align: center; font-style: italic;">
            Belum ada jadwal ujian di database.
          </div>`;
        return;
      } else if (scheduleData.length === 0 && isFetching) {
        return; 
      }
      
      container.innerHTML = ''; 
      let activeSubjectsCount = 0; // Menghitung berapa banyak ujian yang TERSEDIA

      scheduleData.forEach(item => {
        const releaseTime = parseCustomDate(item.releaseStr);
        const expireTime = parseCustomDate(item.expireStr);
        
        let status = 'WAITING'; 

        // Logika penentuan status waktu
        if (releaseTime && expireTime) {
          if (now < releaseTime) {
            status = 'WAITING';
          } else if (now >= expireTime) {
            status = 'CLOSED';
          } else {
            status = 'OPEN';
          }
        } else {
            // JIKA TANGGAL KOSONG DI SHEET: Defaultnya adalah WAITING (Belum Mulai)
            status = 'WAITING';
        }
        
        // HANYA MUNCULKAN MAPEL JIKA STATUSNYA "OPEN"
        if (status !== 'OPEN') {
           return; // Lanjutkan ke mapel berikutnya, jangan render yang ini
        }
        
        activeSubjectsCount++; // Tambah hitungan ujian aktif

        // Pembuatan elemen kartu ujian (Semua yang lolos filter pasti terbuka)
        const a = document.createElement('a');
        a.className = `subject-box`;
        a.href = item.url;
        
        a.innerHTML = `
          <div style="z-index: 2; margin-bottom: 2px;">${item.subject}</div>
          <div class="status-badge status-open" style="z-index: 2;">TERSEDIA</div>
        `;
        
        // Logika saat diklik
        a.addEventListener('click', (e) => {
          e.preventDefault();
          if (item.url && item.url.includes('http')) {
             openExamModal(item.url, item.subject);
          } else {
             showAlert("Link ujian belum tersedia!");
          }
        });

        container.appendChild(a);
      });

      // Tampilkan pesan khusus jika tidak ada satupun ujian yang sedang OPEN
      if (activeSubjectsCount === 0) {
        container.innerHTML = `
          <div style="color: #a0aec0; width: 100%; text-align: center; font-style: italic; padding: 20px;">
            Belum ada ujian yang tersedia saat ini.<br/>
            <span style="font-size: 13px; opacity: 0.7;">Tunggu sesuai jadwal ujian yang telah ditentukan.</span>
          </div>`;
      }
    }

    let confirmCallback = null;

    function showConfirmModal(message, callback) {
      document.getElementById('confirm-message').textContent = message;
      document.getElementById('confirm-yes-btn').classList.remove('hidden');
      document.getElementById('confirm-cancel-btn').textContent = "Batal";
      document.getElementById('custom-confirm-modal').classList.remove('hidden');
      confirmCallback = callback;
    }

    function showAlert(message) {
      document.getElementById('confirm-message').textContent = message;
      document.getElementById('confirm-yes-btn').classList.add('hidden'); 
      document.getElementById('confirm-cancel-btn').textContent = "OK Mengerti";
      document.getElementById('custom-confirm-modal').classList.remove('hidden');
      confirmCallback = null;
    }

    function closeConfirmModal() {
      document.getElementById('custom-confirm-modal').classList.add('hidden');
      confirmCallback = null;
    }

    document.getElementById('confirm-yes-btn').addEventListener('click', () => {
      if (confirmCallback) confirmCallback();
      closeConfirmModal();
    });

    function openExamModal(url, title) {
      const modal = document.getElementById('exam-modal');
      const iframe = document.getElementById('exam-iframe');
      const titleDisplay = document.getElementById('exam-title-display');

      if (titleDisplay) titleDisplay.textContent = title;
      
      let embedUrl = url;
      if (embedUrl.includes('docs.google.com/forms') && !embedUrl.includes('embedded=true')) {
        embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'embedded=true';
      }

      if (iframe) iframe.src = embedUrl;
      if (modal) modal.classList.remove('hidden');
    }

    function requestCloseExam() {
      showConfirmModal("Apakah Anda yakin ingin keluar dari lembar ujian dan kembali ke jadwal?", () => {
        const modal = document.getElementById('exam-modal');
        const iframe = document.getElementById('exam-iframe');
        if (iframe) iframe.src = "";
        if (modal) modal.classList.add('hidden');
      });
    }

    function requestLogout() {
      showConfirmModal("Apakah Anda yakin ingin keluar/logout dari aplikasi?", () => {
        sessionStorage.removeItem("userNama");
        window.location.href = "https://ekosantoso411-pixel.github.io/portal-login/"; 
      });
    }

    function updateLiveClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const timeEl = document.getElementById('live-time');
      if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds} WIB`;

      const dateEl = document.getElementById('live-date');
      if (dateEl) {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        dateEl.textContent = now.toLocaleDateString('id-ID', options);
      }
    }

    const canvas = document.getElementById('background-canvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    
    let width, height;
    let particles = [];
    const connectionDistance = 150;

    function resizeCanvas() {
      if (!canvas) return;
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.radius = Math.random() * 2 + 1;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;
      }
      draw() {
        if (!ctx) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 195, 255, 0.8)';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const numberOfParticles = (width * height) / 25000;
      for (let i = 0; i < numberOfParticles; i++) {
        particles.push(new Particle());
      }
    }

    function drawConnections() {
      if (!ctx) return;
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          let dx = particles[a].x - particles[b].x;
          let dy = particles[a].y - particles[b].y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < connectionDistance) {
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            let opacity = 1 - (distance / connectionDistance);
            ctx.strokeStyle = `rgba(0, 195, 255, ${opacity * 0.3})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    }

    function drawGrid() {
      if (!ctx) return;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
      ctx.lineWidth = 1;
      const gridSize = 50;
      ctx.beginPath();
      for (let x = 0; x <= width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
      }
      for (let y = 0; y <= height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, height);
      }
      ctx.stroke();
    }

    function animate() {
      if (!ctx) return;
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, width, height);
      drawGrid();
      particles.forEach(particle => {
        particle.update();
        particle.draw();
      });
      drawConnections();
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });

    window.onload = function() {
      resizeCanvas();
      initParticles();
      animate();
    };
  </script>
</body>
</html>
